<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h4>Home |</h4>
        <h4>Dang nhap |</h4>
        <h4>Dang ky</h4>
    </div>
    <div class="container">
        <h3 style="text-align: center;" >Man hinh dang nhap</h3>
       
        <div class="row" >
            <div class="col-25">
              <label for="fname">User name</label>
            </div>
            <div class="col-75">
              <input type="text" id="fname" name="firstname" >
            </div>
          </div>
          <div class="row">
            <div class="col-25">
              <label for="lname">Mat khau</label>
            </div>
            <div class="col-75">
              <input type="password" id="lname" name="lastname" >
            </div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Ghi nhớ đăng nhập</label>
        </div>
        <div style="display: flex;">
          <div class="forgot-password" style="margin: 12px;">
            <a href="#">Quên mật khẩu</a>
        </div>
        <button style="height: min-content; margin-top: 15px;background-color: blue;color: white;" type="submit">Đăng nhập</button>
        </div>
        
    </div>
    <div class="footer">
        <h5>Lap trinh web @1/2024</h5>
    </div>
</body>
</html>
