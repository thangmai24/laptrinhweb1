<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
}

.header {
    width: 100%;
    background-color: #fff;
    border-bottom: 1px solid #ccc;
    padding: 10px 0;
    text-align: center;
}

.header span {
    margin: 0 5px;
    font-size: 16px;
    color: #333;
    cursor: pointer;
}

.header span:hover {
    color: #007bff;
}

.detail-container {
    background-color: #fff;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    width: 300px;
    text-align: center;
    margin: 20px 0;
}

h2 {
    margin-bottom: 20px;
    font-size: 20px;
    color: #333;
}

.info-group {
    margin-bottom: 15px;
    text-align: left;
}

.info-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #333;
    font-weight: bold;
}

.info-group p {
    margin: 0;
    font-size: 14px;
    color: #333;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    background-color: #f9f9f9;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

.footer {
    width: 100%;
    background-color: #fff;
    border-top: 1px solid #ccc;
    padding: 10px 0;
    text-align: center;
    position: fixed;
    bottom: 0;
}

.footer p {
    margin: 0;
    font-size: 14px;
    color: #333;
}
    </style>
</head>
<body>
    <div class="header">
        <span>Home</span> | <span>Đăng xuất</span>
    </div>
    <div class="detail-container">
        <h2>Màn hình chi tiết</h2>
        <div class="info-group">
            <label>Username</label>
            <p>test1</p>
        </div>
        <div class="info-group">
            <label>Email</label>
            <p>test1@gmail.com</p>
        </div>
        <button onclick="window.location.href='update.html'">Chỉnh sửa</button>
    </div>
    <div class="footer">
        <p>Lập trình web @01/2024</p>
    </div>
</body>
</html>
